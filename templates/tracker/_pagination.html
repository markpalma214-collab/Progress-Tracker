{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="btn btn-ghost btn-small" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-ghost btn-small" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% endif %}
</nav>
{% endif %}
