{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{% else %}
    <div class="field{% if field.errors %} has-error{% endif %}{% if field.widget_type == 'checkbox' %} field-check{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<small class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
      {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
    </div>
  {% endif %}
{% endfor %}
